[project]
name = "agent-sandbox-backend"
version = "0.1.0"
description = "AG-UI chat agent backend for Agent Sandbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework>=1.0.0rc1",
    "agent-framework-ag-ui>=1.0.0b260219",
    "azure-identity",
    "fastapi",
    "fastmcp>=3.0.1",
    "httpx",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-starlette",
    "uvicorn",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ipykernel",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]
