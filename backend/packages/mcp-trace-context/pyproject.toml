[project]
name = "mcp-trace-context"
version = "1.0.0"
description = "W3C Trace Context propagation for MCP tool calls via _meta"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.20.0",
]

[project.optional-dependencies]
agent-framework = ["agent-framework>=1.0.0b0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "opentelemetry-sdk>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_trace_context"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
